services:
  - type: web
    name: more-fm-automation-system
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MORE_FM_DATA_DIR
        value: /var/data/more-fm
    disk:
      name: more-fm-data
      mountPath: /var/data
      sizeGB: 1

name: Build RJ FM Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'components/station/bottom-navigation.tsx'
      - 'components/station/vpn-panel.tsx'
      - 'components/pwa-register.tsx'
      - 'public/sw.js'
      - 'public/offline.html'
      - 'public/manifest.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'components/station/account-menu.tsx'
      - 'components/station/app-update-gate.tsx'
      - 'public/app-update.json'
      - 'lib/app-permissions.ts'
      - 'components/station/radio-player.tsx'
      - 'hooks/use-broadcast.ts'
      - 'components/station/station-shell.tsx'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Apply RJ FM launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          curl -L 'https://raw.githubusercontent.com/jvchannel48-ship-it/more-fm-automation-system/main/public/rjfm-app-icon.svg' -o /tmp/rjfm-logo.svg
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert -background "#040f1e" /tmp/rjfm-logo.svg -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Configure Android permissions, app version, and battery optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          additions = '''    <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          '''
          s = s.replace('<application', additions + '\n    <application', 1)
          service = '''        <service
                  android:name=".BackgroundAudioService"
                  android:exported="false"
                  android:foregroundServiceType="mediaPlayback" />
          '''
          s = s.replace('</application>', service + '\n    </application>', 1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          parts = (version.split('.') + ['0', '0'])[:3]
          code = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])
          gradle = Path('android/app/build.gradle')
          source = gradle.read_text()
          source = re.sub(r'versionCode\s+\d+', 'versionCode ' + str(code), source)
          source = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + version + '"', source)
          gradle.write_text(source)
          PY
          mkdir -p android/app/src/main/java/com/rjfm/app
          cat > android/app/src/main/java/com/rjfm/app/BatteryOptimizationPlugin.java <<'JAVA'
          package com.rjfm.app;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "BatteryOptimization")
          public class BatteryOptimizationPlugin extends Plugin {
            @PluginMethod public void isIgnoringOptimizations(PluginCall call) {
              PowerManager power = (PowerManager) getContext().getSystemService(getContext().POWER_SERVICE);
              JSObject result = new JSObject();
              result.put("exempt", power != null && power.isIgnoringBatteryOptimizations(getContext().getPackageName()));
              call.resolve(result);
            }
            @PluginMethod public void requestExemption(PluginCall call) {
              try {
                Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                getActivity().startActivity(intent);
                JSObject result = new JSObject(); result.put("opened", true); call.resolve(result);
              } catch (Exception error) { call.reject("Hindi mabuksan ang battery optimization settings.", error); }
            }
          }
          JAVA
          cat > android/app/src/main/java/com/rjfm/app/BackgroundAudioPlugin.java <<'JAVA'
          package com.rjfm.app;

          import android.content.Intent;
          import android.os.Build;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "BackgroundAudio")
          public class BackgroundAudioPlugin extends Plugin {
            @PluginMethod
            public void start(PluginCall call) {
              String station = call.getString("station", "RJ FM Live Radio");
              Intent intent = new Intent(getContext(), BackgroundAudioService.class);
              intent.setAction(BackgroundAudioService.ACTION_START);
              intent.putExtra(BackgroundAudioService.EXTRA_STATION, station);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) getContext().startForegroundService(intent);
              else getContext().startService(intent);
              call.resolve();
            }

            @PluginMethod
            public void stop(PluginCall call) {
              Intent intent = new Intent(getContext(), BackgroundAudioService.class);
              intent.setAction(BackgroundAudioService.ACTION_STOP);
              getContext().startService(intent);
              call.resolve();
            }
          }
          JAVA
          cat > android/app/src/main/java/com/rjfm/app/BackgroundAudioService.java <<'JAVA'
          package com.rjfm.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class BackgroundAudioService extends Service {
            public static final String ACTION_START = "com.rjfm.app.action.START_BACKGROUND_AUDIO";
            public static final String ACTION_STOP = "com.rjfm.app.action.STOP_BACKGROUND_AUDIO";
            public static final String EXTRA_STATION = "station";
            private static final String CHANNEL_ID = "rjfm_background_audio";
            private static final int NOTIFICATION_ID = 935;
            private PowerManager.WakeLock wakeLock;
            private String station = "RJ FM Live Radio";

            @Override public void onCreate() {
              super.onCreate();
              NotificationManager manager = getSystemService(NotificationManager.class);
              if (manager != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "RJ FM playback", NotificationManager.IMPORTANCE_LOW);
                channel.setDescription("Shows when RJ FM is playing in the background.");
                manager.createNotificationChannel(channel);
              }
            }

            @Override public int onStartCommand(Intent intent, int flags, int startId) {
              if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                stopForeground(true);
                releaseWakeLock();
                stopSelf();
                return START_NOT_STICKY;
              }
              if (intent != null) station = intent.getStringExtra(EXTRA_STATION) == null ? station : intent.getStringExtra(EXTRA_STATION);
              PowerManager power = (PowerManager) getSystemService(POWER_SERVICE);
              if (power != null && (wakeLock == null || !wakeLock.isHeld())) {
                wakeLock = power.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "RJFM:BackgroundAudio");
                wakeLock.acquire(12 * 60 * 60 * 1000L);
              }
              Notification notification = buildNotification();
              if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
              else startForeground(NOTIFICATION_ID, notification);
              return START_STICKY;
            }

            private Notification buildNotification() {
              Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
              PendingIntent content = launch == null ? null : PendingIntent.getActivity(this, 1, launch,
                PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
              Intent stop = new Intent(this, BackgroundAudioService.class);
              stop.setAction(ACTION_STOP);
              PendingIntent stopAction = PendingIntent.getService(this, 2, stop,
                PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
              Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);
              builder.setSmallIcon(android.R.drawable.ic_media_play)
                .setContentTitle(station)
                .setContentText("RJ FM is playing · Tap to return to the radio")
                .setOngoing(true)
                .setOnlyAlertOnce(true)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .addAction(new Notification.Action.Builder(android.R.drawable.ic_media_pause, "Stop", stopAction).build());
              if (content != null) builder.setContentIntent(content);
              if (Build.VERSION.SDK_INT >= 21) builder.setCategory(Notification.CATEGORY_TRANSPORT);
              return builder.build();
            }

            private void releaseWakeLock() {
              if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              wakeLock = null;
            }

            @Override public void onDestroy() {
              releaseWakeLock();
              super.onDestroy();
            }

            @Override public IBinder onBind(Intent intent) { return null; }
          }
          JAVA
          cat > android/app/src/main/java/com/rjfm/app/MainActivity.java <<'JAVA'
          package com.rjfm.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(BatteryOptimizationPlugin.class);
              registerPlugin(BackgroundAudioPlugin.class);
              super.onCreate(savedInstanceState);
              // Permission prompts are shown from the RJ FM profile permissions page, not at launch.
            }
          }
          JAVA

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rj-fm-android.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FM-Android
          path: rj-fm-android.apk
          retention-days: 30

      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: RJ FM Android App
          body: Latest standalone RJ FM Android APK.
          files: rj-fm-android.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true

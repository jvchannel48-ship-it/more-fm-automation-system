name: RJ FM AutoDJ checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/rjfm-24-7-autodj]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:schedule
      - run: pnpm test:song-filter
      - run: pnpm exec tsc --noEmit
